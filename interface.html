<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>VlogPilot Controller</title>

        <style>
            *{box-sizing:border-box}

            body{
                margin:0;
                background:#101b16;
                color:#fff;
                font-family:Arial,sans-serif
            }
            main{
                width: 100%;
                max-width:750px;
                min-height: 100dvh;
                margin:auto;
                padding:12px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                text-align:center;
            }
            h1{
                color:#c4d68d;
                margin-bottom:5px
            }
            p{
                color:#cbd5c5
            }
            .grid{
                display:grid;
                grid-template-columns:repeat(3, minmax(0, 1fr));
                gap:10px;
                margin-top:15px
            }
            button{
                width: 100%;
                height: clamp(100px, 19dvh, 170px);
                border:2px solid #a8bf69;
                border-radius:12px;
                background:#304b3b;
                color:white;
                font-size:30px;
                cursor:pointer;
                touch-action:manipulation;
            }
            button:active{
                background:#719044
            }
            button:focus-visible{
                outline:3px solid #fff;
                outline-offset:2px;
            }
            .stop{
                background:#9d3939;
                border-color:#d87b7b;
                font-size:25px;
                font-weight:bold;
            }
            .reset{
                font-size:25px;
                font-weight:bold;
                color:#18301c;
                background:#b3c95e;
                border-color:#578f61;
            }
            .empty{
                visibility:hidden
            }
            #status{
                margin-top:20px;
                color:#c4d68d;
                font-size:15px
            }
        </style>
    </head>

    <body>
        <main>
            <h1>VlogPilot</h1>
            <div class="grid">
            <button class="stop" onclick="send('stopx')" aria-label="Stop horizontal rotation">STOP</button>
            <button onclick="send('up')" aria-label="Tilt up">&#9650;</button>
            <span></span>
            <button onclick="send('left')" aria-label="Rotate left">&#9664;</button>
            <button class="reset" onclick="send('reset')" aria-label="Reset position">RESET</button>
            <button onclick="send('right')" aria-label="Rotate right">&#9654;</button>
            <span></span>
            <button onclick="send('down')" aria-label="Tilt down">&#9660;</button>
            <span></span>
            </div>
        </main>
        <script>
            function send(cmd) {
                fetch('/motor/' + cmd + '/').catch(() => {});
            }
        </script>    
    </body>
</html>
